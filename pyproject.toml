[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "html-to-elementor"
version = "0.1.0"
description = "Convert HTML pages into native Elementor templates (containers + widgets). CLI, Python library, MCP server and agent skill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["elementor", "wordpress", "html", "converter", "mcp", "page-builder"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
html-to-elementor = "html_to_elementor.cli:main"
html-to-elementor-mcp = "html_to_elementor.server:main"

[project.urls]
Homepage = "https://github.com/istiackmohammad/html-to-elementor"
Issues = "https://github.com/istiackmohammad/html-to-elementor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/html_to_elementor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
